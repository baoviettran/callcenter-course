name: Deploy course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # index.html is generated from _base.html + modules/*.html + _footer.html.
      # Regenerate and fail if the committed copy is stale, so modules/ stays
      # the source of truth and we never publish a half-applied edit.
      - name: Rebuild index.html
        run: bash build.sh

      - name: Check index.html is not stale
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is out of date — run 'bash build.sh' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      # Publish only what the page actually needs: no briefs/, modules/,
      # or design docs on the deployed site.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css main.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' "$url")
          echo "$url -> HTTP $code"
          test "$code" = "200"
          grep -q "Call Center Platform" /tmp/live.html
          echo "Homepage served and title present."
